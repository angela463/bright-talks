<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View lessons for a Bright Talks module." />
  <title>Module Lessons: Bright Talks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/platform.css" />
</head>
<body class="page-courses" id="top">
  <header class="site-header site-header--landing">
    <div class="header-inner header-inner--landing">
      <a href="index.html" class="logo-link">
        <img src="png/Bright-Talks-logo-createoutlines.png" alt="Bright Talks" class="logo-img" />
      </a>
      <nav class="nav nav--landing" aria-label="Main">
        <a href="index.html" class="nav-link nav-link--minimal">Home</a>
        <div class="nav-dropdown">
          <a href="courses.html" class="nav-link nav-link--minimal nav-trigger" aria-expanded="false" aria-haspopup="true" aria-controls="nav-courses-menu" id="nav-courses-btn">Courses</a>
          <div id="nav-courses-menu" class="nav-panel nav-panel--courses" role="menu">
            <a href="courses.html" role="menuitem">Course library</a>
            <a href="course-detail.html" role="menuitem" aria-current="page">Course modules</a>
          </div>
        </div>
        <a href="faq.html" class="nav-link nav-link--minimal">FAQs</a>
        <a href="about.html" class="nav-link nav-link--minimal">Why Bright Talks</a>
      </nav>
      <a href="index.html#waitlist" class="btn btn-primary">Join</a>
    </div>
  </header>

  <main class="page-shell module-page-shell">
    <section class="hero-panel">
      <h1>Taking you to lessons…</h1>
      <p>This step has been removed from the flow.</p>
      <p><a id="module-redirect-link" class="btn btn-primary" href="lesson-player.html?course=ages-3-5&amp;module=0&amp;lesson=0">Open lessons</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2025 Bright Talks. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var course = params.get('course') || 'ages-3-5';
      var module = params.get('module') || '0';
      var target = 'lesson-player.html?course=' + encodeURIComponent(course) + '&module=' + encodeURIComponent(module) + '&lesson=0';
      var link = document.getElementById('module-redirect-link');
      if (link) link.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
