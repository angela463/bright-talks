<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bright Talks video library — warm courses and talks to help parents lead honest, age-right conversations at home." />
  <title>Video Library | Bright Talks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/platform.css" />
  <link rel="stylesheet" href="css/course-experience.css" />
</head>
<body class="page-courses-v2 page-bt-library">
  <header class="site-header site-header--landing bt-library-header">
    <div class="header-inner header-inner--landing">
      <a href="index.html" class="logo-link">
        <img src="png/Bright-Talks-logo-createoutlines.png" alt="Bright Talks" class="logo-img" />
      </a>
      <nav class="nav nav--landing" aria-label="Main">
        <a href="index.html" class="nav-link nav-link--minimal">Home</a>
        <a href="courses-v2.html" class="nav-link nav-link--minimal nav-link--current">Video Library</a>
        <a href="courses.html" class="nav-link nav-link--minimal">Courses</a>
        <a href="about.html" class="nav-link nav-link--minimal">About</a>
        <a href="faq.html" class="nav-link nav-link--minimal">FAQs</a>
      </nav>
      <div class="bt-library-header__actions">
        <a href="free-course-signup.html" class="btn btn-secondary bt-library-sign-in">Sign In</a>
        <a href="free-course-signup.html" class="btn btn-primary">Try a Course Free</a>
      </div>
    </div>
  </header>

  <main class="bt-library-main">
    <div class="bt-library-layout">
      <aside class="bt-library-sidebar" aria-label="Browse library">
        <p class="bt-library-sidebar__label">Browse by Type</p>
        <div class="bt-library-sidebar__panel">
          <nav id="bt-library-sidebar-nav" class="bt-library-sidebar__nav"></nav>
        </div>
        <div class="bt-library-sidebar__filters">
          <label class="sr-only" for="course-library-v2-search">Search library</label>
          <input id="course-library-v2-search" type="search" placeholder="Search talks…" />
        </div>
      </aside>

      <div class="bt-library-content">
        <div id="bt-library-age-filter" class="bt-library-age-filter" role="group" aria-label="Filter by age"></div>
        <div id="course-library-v2-root" class="bt-library-series-list"></div>
        <div id="course-library-v2-empty" class="bt-library-empty" hidden>
          <h2>No courses match these filters</h2>
          <p>Adjust your search or age filter and try again.</p>
        </div>
      </div>
    </div>
  </main>

  <nav id="bt-library-mobile-nav" class="bt-library-mobile-nav" aria-label="Library navigation"></nav>

  <script src="js/course-experience-data.js"></script>
  <script src="js/course-experience-common.js"></script>
  <script src="js/course-library-v2.js"></script>
</body>
</html>
